<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a2e4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Spacer's Buvette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ── Tokens ───────────────────────────────────────────────────────────── */
:root {
  --text-xs:   0.8125rem;
  --text-sm:   0.9375rem;
  --text-base: 1.0625rem;
  --text-lg:   1.375rem;
  --text-xl:   2rem;
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;
  --radius-sm:.375rem;--radius-md:.625rem;--radius-lg:.875rem;--radius-xl:1.125rem;--radius-full:9999px;
  --transition:160ms cubic-bezier(0.16,1,0.3,1);
  --font-body:'Inter','Helvetica Neue',Arial,sans-serif;
  --sidebar-w: 360px;
  --navy:#1a2e4a;--navy-2:#24406a;--gold:#f5c518;
}
/* Thème clair (par défaut) : fond lumineux, texte très contrasté, cartes blanches en relief */
[data-theme="light"] {
  --bg:#eef2f7;--surface:#ffffff;--surface-2:#f4f6fa;--surface-3:#e6eaf1;
  --border:rgba(16,32,56,.14);--divider:rgba(16,32,56,.09);
  --text:#0d1726;--text-muted:#3f4b5e;--text-faint:#6b7689;
  --primary:#1a2e4a;--primary-hover:#24406a;--on-primary:#ffffff;
  --success:#1d7a32;--success-bg:#e3f4e7;
  --warning:#a85a00;--warning-bg:#fff1dc;
  --error:#c0262d;--error-bg:#fde6e7;
  --card-shadow:0 1px 2px rgba(16,32,56,.06),0 6px 18px rgba(16,32,56,.10);
  --card-shadow-active:0 2px 4px rgba(16,32,56,.08),0 10px 26px rgba(16,32,56,.16);
  --shadow:0 10px 30px rgba(16,32,56,.18);
}
[data-theme="dark"] {
  --bg:#171a20;--surface:#262a33;--surface-2:#2f343f;--surface-3:#3a404c;
  --border:rgba(255,255,255,.14);--divider:rgba(255,255,255,.08);
  --text:#f6f7f9;--text-muted:#c3c8d2;--text-faint:#9299a6;
  --primary:#f5c518;--primary-hover:#ffd63d;--on-primary:#13213a;
  --success:#5fd07a;--success-bg:rgba(95,208,122,.15);
  --warning:#ffb547;--warning-bg:rgba(255,181,71,.15);
  --error:#ff6b72;--error-bg:rgba(255,107,114,.15);
  --card-shadow:0 4px 16px rgba(0,0,0,.35);
  --card-shadow-active:0 8px 24px rgba(0,0,0,.5);
  --shadow:0 10px 30px rgba(0,0,0,.5);
}

/* ── Reset ────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow:hidden;-webkit-text-size-adjust:none;text-size-adjust:none}
body{height:100%;font-family:var(--font-body);font-size:var(--text-base);color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{cursor:pointer;border:none;background:none;font:inherit;color:inherit;touch-action:manipulation}
button:disabled{cursor:not-allowed}
input,select{font:inherit;color:inherit;user-select:text;-webkit-user-select:text}

/* ── Layout paysage : produits à gauche, caisse à droite ──────────────── */
#app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:1fr var(--sidebar-w);grid-template-areas:"header header" "main side";height:100dvh;background:var(--bg)}
.header{grid-area:header}
.main{grid-area:main}
.side{grid-area:side}

/* ── Header ───────────────────────────────────────────────────────────── */
.header{background:var(--navy);padding:var(--space-2) var(--space-5);display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.header-left{display:flex;align-items:center;gap:var(--space-4);min-width:0}
.logo{display:flex;align-items:center;gap:var(--space-3)}
.logo-icon{width:34px;height:34px;flex-shrink:0}
.logo-text{font-size:var(--text-base);font-weight:800;color:#fff;line-height:1.15}
.logo-sub{font-size:var(--text-xs);color:rgba(255,255,255,.75);font-weight:500}
.tab-selector{display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none}
.tab-selector::-webkit-scrollbar{display:none}
.tab-btn{flex-shrink:0;padding:var(--space-2) var(--space-4);border-radius:var(--radius-full);font-size:var(--text-sm);font-weight:700;background:rgba(255,255,255,.1);color:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.18);transition:all var(--transition);min-height:40px}
.tab-btn.active{background:var(--gold);color:var(--navy);border-color:transparent}
.header-right{display:flex;align-items:center;gap:var(--space-2)}
.match-badge{background:rgba(245,197,24,.18);border:1px solid rgba(245,197,24,.45);border-radius:var(--radius-full);padding:var(--space-1) var(--space-3);font-size:var(--text-xs);color:var(--gold);font-weight:700;white-space:nowrap}
.btn-icon{width:42px;height:42px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);color:#fff;transition:background var(--transition)}
.btn-icon:hover{background:rgba(255,255,255,.22)}
.btn-icon svg{width:20px;height:20px}

/* ── Zone produits ────────────────────────────────────────────────────── */
.main{overflow-y:auto;overscroll-behavior:contain;padding:var(--space-3) var(--space-4) var(--space-6);display:flex;flex-direction:column;gap:var(--space-4)}
.section-title{font-size:var(--text-sm);font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:.06em;margin-bottom:var(--space-2);display:flex;align-items:center;gap:var(--space-2)}
.section-title::after{content:'';flex:1;height:2px;background:var(--divider);border-radius:2px}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:var(--space-3)}

.product-card{--accent:#1a2e4a;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--card-shadow);display:flex;flex-direction:column;overflow:hidden;position:relative;transition:box-shadow var(--transition),border-color var(--transition),transform var(--transition)}
.product-card.has-sale{border-color:var(--accent);box-shadow:var(--card-shadow-active),0 0 0 2px var(--accent) inset}
.product-card.is-empty{opacity:.55}
.card-band{height:6px;background:var(--accent)}
.card-body{padding:.625rem .75rem;display:flex;flex-direction:column;gap:var(--space-2);flex:1}
.product-head{display:flex;align-items:center;gap:var(--space-3)}
.product-icon{width:36px;height:36px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:1.35rem;flex-shrink:0;background:color-mix(in srgb,var(--accent) 16%,transparent);border:1.5px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.product-name{font-size:1rem;font-weight:800;line-height:1.15;color:var(--text)}
.product-price{font-size:1.25rem;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;line-height:1;margin-top:2px}
.product-price small{font-size:var(--text-xs);font-weight:600;color:var(--text-muted)}
.qty-control{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-top:auto}
.qty-btn{flex:1 1 0;min-width:40px;max-width:56px;height:50px;border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:1.75rem;font-weight:700;line-height:1;transition:transform var(--transition),background var(--transition);flex-shrink:0}
.qty-btn:active{transform:scale(.94)}
.qty-btn.minus{background:var(--surface-2);border:1.5px solid var(--border);color:var(--text)}
.qty-btn.plus{background:var(--primary);color:var(--on-primary)}
.qty-btn:disabled{opacity:.35}
.qty-display{flex:0 0 auto;font-size:1.75rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:36px;text-align:center;color:var(--text)}
.stock-remaining{font-size:var(--text-xs);font-weight:600;color:var(--text-muted)}
.stock-remaining.low{color:var(--warning)}
.stock-remaining.empty{color:var(--error)}

/* ── Colonne caisse (droite) ──────────────────────────────────────────── */
.side{background:var(--surface);border-left:1.5px solid var(--border);display:flex;flex-direction:column;min-height:0}
.side-scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-4)}
.side-title{font-size:var(--text-xs);font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:var(--space-2)}

.alert-banner{border-radius:var(--radius-md);padding:var(--space-3);font-size:var(--text-sm);font-weight:700;display:flex;align-items:center;gap:var(--space-2)}
.alert-banner+.alert-banner{margin-top:var(--space-2)}
.alert-banner.warn{background:var(--warning-bg);color:var(--warning);border:1.5px solid color-mix(in srgb,var(--warning) 40%,transparent)}
.alert-banner.err{background:var(--error-bg);color:var(--error);border:1.5px solid color-mix(in srgb,var(--error) 40%,transparent)}
@keyframes slideIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

.stock-list{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-2)}
.stock-item{min-width:0;background:var(--surface-2);border:1px solid var(--divider);border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.stock-label{font-size:var(--text-xs);font-weight:600;color:var(--text-muted);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock-qty{font-size:var(--text-base);font-weight:800;font-variant-numeric:tabular-nums}
.stock-qty.ok{color:var(--success)}
.stock-qty.warn{color:var(--warning)}
.stock-qty.crit{color:var(--error)}

.ecocup-card{background:var(--surface-2);border:1.5px solid color-mix(in srgb,var(--warning) 35%,transparent);border-radius:var(--radius-lg);padding:var(--space-3)}
.ecocup-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-2)}
.ecocup-item{background:var(--surface);border:1px solid var(--divider);border-radius:var(--radius-md);padding:var(--space-2)}
.ecocup-label{font-size:var(--text-xs);font-weight:700;color:var(--text-muted);margin-bottom:var(--space-2);text-align:center}
.ecocup-controls{display:flex;align-items:center;justify-content:space-between;gap:var(--space-1)}
.ecocup-controls .qty-btn{height:44px;font-size:1.4rem}
.ecocup-controls .qty-display{font-size:var(--text-lg);min-width:28px}
.ecocup-net{font-size:var(--text-sm);font-weight:600;color:var(--text-muted);margin-top:var(--space-3);display:flex;justify-content:space-between}
.ecocup-net b{color:var(--warning);font-weight:800}

.side-footer{border-top:1.5px solid var(--border);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);background:var(--surface)}
.ca-label{font-size:var(--text-xs);font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
.ca-value{font-size:2.25rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--success);line-height:1.05}
.btn-sync{background:var(--primary);color:var(--on-primary);border-radius:var(--radius-lg);padding:var(--space-4);font-size:var(--text-base);font-weight:800;display:flex;align-items:center;justify-content:center;gap:var(--space-2);transition:background var(--transition);min-height:60px}
.btn-sync:hover{background:var(--primary-hover)}
.btn-sync svg{width:22px;height:22px}

/* ── Indication portrait ──────────────────────────────────────────────── */
.rotate-hint{display:none}
@media (orientation: portrait) {
  #app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;grid-template-areas:"header" "hint" "main" "side"}
  .rotate-hint{display:flex;grid-area:hint;align-items:center;justify-content:center;gap:var(--space-2);background:var(--gold);color:var(--navy);font-weight:800;font-size:var(--text-sm);padding:var(--space-2) var(--space-4)}
  .side{border-left:none;border-top:1.5px solid var(--border);max-height:42dvh}
  .header{flex-wrap:wrap}
}
@media (max-width: 1100px) and (orientation: landscape) { :root{--sidebar-w:310px} .product-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))} }

/* ── Modals ───────────────────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(8,16,30,.55);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:var(--space-4)}
.modal-overlay.open{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:var(--radius-xl);padding:var(--space-6);width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;box-shadow:var(--shadow);animation:slideUp .25s cubic-bezier(.16,1,.3,1);user-select:text;-webkit-user-select:text}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-size:var(--text-lg);font-weight:800;margin-bottom:var(--space-4);padding-right:var(--space-8)}
.modal-close{position:absolute;top:var(--space-4);right:var(--space-4);width:40px;height:40px;border-radius:var(--radius-full);background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--text-muted)}

.settings-form{display:flex;flex-direction:column;gap:var(--space-4)}
.form-row{display:flex;flex-direction:column;gap:var(--space-2)}
.form-label{font-size:var(--text-sm);font-weight:700;color:var(--text-muted)}
.form-input{background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);font-size:var(--text-base);color:var(--text);width:100%}
.form-input:focus{outline:2px solid var(--primary);outline-offset:2px}
.btn-primary{background:var(--primary);color:var(--on-primary);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);font-weight:800;width:100%;min-height:50px;transition:background var(--transition)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1.5px solid var(--border)}

.rapport-section{margin-bottom:var(--space-4)}
.rapport-section-title{font-size:var(--text-xs);font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:var(--space-2)}
.rapport-row{display:flex;justify-content:space-between;align-items:center;padding:var(--space-2) 0;border-bottom:1px solid var(--divider);font-size:var(--text-sm)}
.rapport-row:last-child{border-bottom:none}
.rapport-row b{font-variant-numeric:tabular-nums}
.rapport-total{background:var(--success-bg);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);display:flex;justify-content:space-between;align-items:center;margin:var(--space-3) 0}
.rapport-total-label{font-weight:800;color:var(--success)}
.rapport-total-value{font-size:var(--text-lg);font-weight:800;color:var(--success);font-variant-numeric:tabular-nums}
.json-block{background:var(--surface-2);border-radius:var(--radius-md);padding:var(--space-3);font-size:11px;font-family:monospace;color:var(--text-muted);white-space:pre-wrap;word-break:break-all;max-height:200px;overflow-y:auto;margin-top:var(--space-3)}
.btn-copy{background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius-md);padding:var(--space-2) var(--space-4);font-size:var(--text-sm);font-weight:700;width:100%;margin-top:var(--space-2);min-height:46px}
.btn-copy:hover{background:var(--surface-3)}

.sync-status{border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);font-weight:700;display:none;margin-top:var(--space-3)}
.sync-status.ok{background:var(--success-bg);color:var(--success);display:block}
.sync-status.err{background:var(--error-bg);color:var(--error);display:block}
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 28 28" fill="none" aria-label="Spacer's Buvette">
          <circle cx="14" cy="14" r="13" fill="#1a2e4a" stroke="#f5c518" stroke-width="1.5"/>
          <path d="M8 10 Q14 6 20 10 L20 18 Q14 22 8 18 Z" fill="none" stroke="#f5c518" stroke-width="1.2"/>
          <circle cx="14" cy="14" r="2.5" fill="#f5c518"/>
          <line x1="14" y1="8" x2="14" y2="20" stroke="#f5c518" stroke-width=".8" opacity=".5"/>
          <line x1="8" y1="14" x2="20" y2="14" stroke="#f5c518" stroke-width=".8" opacity=".5"/>
        </svg>
        <div>
          <div class="logo-text">Spacer's Buvette</div>
          <div class="logo-sub" id="match-label">Aucun match configuré</div>
        </div>
      </div>
      <!-- Sélecteur tablette -->
      <div class="tab-selector" id="tab-selector"></div>
    </div>
    <div class="header-right">
      <div class="match-badge" id="tab-badge">Tab. 1</div>
      <button class="btn-icon" onclick="openSettings()" aria-label="Paramètres">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="btn-icon" data-theme-toggle onclick="toggleTheme()" aria-label="Thème">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div class="rotate-hint">↻ Tournez la tablette en mode paysage pour un meilleur affichage</div>

  <!-- PRODUITS -->
  <main class="main" id="products-zone"></main>

  <!-- CAISSE -->
  <aside class="side">
    <div class="side-scroll">
      <div id="alerts-zone"></div>

      <div>
        <div class="side-title">Stock restant</div>
        <div class="stock-list" id="stock-list"></div>
      </div>

      <div>
        <div class="side-title">♻️ Écocups — consigne 1 €</div>
        <div class="ecocup-card" id="ecocup-section">
          <div class="ecocup-grid">
            <div class="ecocup-item">
              <div class="ecocup-label">Vendus 33cl</div>
              <div class="ecocup-controls">
                <button class="qty-btn minus" onclick="changeEcocup('E01',-1)">−</button>
                <div class="qty-display" id="qty-E01">0</div>
                <button class="qty-btn plus" onclick="changeEcocup('E01',1)">+</button>
              </div>
            </div>
            <div class="ecocup-item">
              <div class="ecocup-label">Vendus 50cl</div>
              <div class="ecocup-controls">
                <button class="qty-btn minus" onclick="changeEcocup('E02',-1)">−</button>
                <div class="qty-display" id="qty-E02">0</div>
                <button class="qty-btn plus" onclick="changeEcocup('E02',1)">+</button>
              </div>
            </div>
            <div class="ecocup-item">
              <div class="ecocup-label">Rendus 33cl</div>
              <div class="ecocup-controls">
                <button class="qty-btn minus" onclick="changeRemb('E01',-1)">−</button>
                <div class="qty-display" id="remb-E01">0</div>
                <button class="qty-btn plus" onclick="changeRemb('E01',1)">+</button>
              </div>
            </div>
            <div class="ecocup-item">
              <div class="ecocup-label">Rendus 50cl</div>
              <div class="ecocup-controls">
                <button class="qty-btn minus" onclick="changeRemb('E02',-1)">−</button>
                <div class="qty-display" id="remb-E02">0</div>
                <button class="qty-btn plus" onclick="changeRemb('E02',1)">+</button>
              </div>
            </div>
          </div>
          <div class="ecocup-net">
            <span>Net consignes</span>
            <b id="net-consigne">0,00 €</b>
          </div>
        </div>
      </div>
    </div>

    <div class="side-footer">
      <div>
        <div class="ca-label">CA total (dont consignes)</div>
        <div class="ca-value" id="ca-total-display">0,00 €</div>
      </div>
      <button class="btn-sync" onclick="openRapport()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Rapport de caisse
      </button>
    </div>
  </aside>
</div>

<!-- MODAL SETTINGS -->
<div class="modal-overlay" id="modal-settings">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeModal('modal-settings')">✕</button>
    <div class="modal-title">⚙️ Configuration</div>
    <div class="settings-form">
      <div class="form-row">
        <label class="form-label">Tablette</label>
        <select class="form-input" id="sel-tab">
          <option>Tab. 1</option><option>Tab. 2</option><option>Tab. 3</option>
          <option>Tab. 4</option><option>Tab. 5</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">ID Match</label>
        <input class="form-input" id="inp-match" placeholder="ex: M2025_14" type="text">
      </div>
      <div class="form-row">
        <label class="form-label">Date du match</label>
        <input class="form-input" id="inp-date" type="date">
      </div>
      <div class="form-row">
        <label class="form-label">URL Web App (Google Apps Script)</label>
        <input class="form-input" id="inp-url" placeholder="https://script.google.com/..." type="url">
      </div>
      <button class="btn-primary" onclick="saveSettings()">💾 Enregistrer</button>
      <button class="btn-primary btn-secondary" onclick="syncPreMatch()">📡 Synchro pré-match (GET)</button>
      <div class="sync-status" id="sync-status-pre"></div>
    </div>
  </div>
</div>

<!-- MODAL RAPPORT -->
<div class="modal-overlay" id="modal-rapport">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeModal('modal-rapport')">✕</button>
    <div class="modal-title">📊 Rapport de caisse</div>
    <div id="rapport-content"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
const state = {
  tab:     'Tab. 1',
  matchId: '',
  date:    new Date().toISOString().slice(0,10),
  url:     '',
  stocks:  {},             // Stocks initiaux par tablette { 'Tab. 1': { ref: qty } }
  ventes:  {},             // Ventes en cours { ref: qty }
  ecocups: { E01: 0, E02: 0 },
  rembs:   { E01: 0, E02: 0 },
};

// Catégories affichées (ordre d'affichage)
const CATS = {
  boissons: { label:'🍺 Boissons', order:1 },
  food:     { label:'🌭 Food',     order:2 },
  autre:    { label:'🛒 Autres',   order:9 },
};
// Sous-catégorie produit → section d'affichage
const GROUP_OF = { biere:'boissons', soft:'boissons', eau:'boissons', food:'food', sucre:'food', snack:'food' };

// Catalogue produits — prix saison 25-26 (mis à jour par la synchro Sheet)
// suivi:false → produit vendable sans stock initial (food), sauf si le Sheet envoie un stock pour lui
const CATALOGUE = [
  { ref:'P01_33',   nom:'Bière 33cl',        cat:'biere', pv:3.00, pv50:null, consigne:0, seuil:15, unite:'verres', color:'#d99a00', icon:'🍺' },
  { ref:'P01_50',   nom:'Bière 50cl',        cat:'biere', pv:null, pv50:6.00, consigne:0, seuil:10, unite:'verres', color:'#b86e00', icon:'🍺' },
  { ref:'P02_COCA', nom:'Coca-Cola',         cat:'soft',  pv:3.00, pv50:null, consigne:0, seuil:5,  color:'#d7141f', icon:'🥤' },
  { ref:'P02_ORAN', nom:'Orangina',          cat:'soft',  pv:3.00, pv50:null, consigne:0, seuil:5,  color:'#ef7d00', icon:'🍊' },
  { ref:'P02_ICET', nom:'Ice Tea',           cat:'soft',  pv:3.00, pv50:null, consigne:0, seuil:5,  color:'#a8690f', icon:'🍑' },
  { ref:'P02_SCHW', nom:'Schweppes Agrumes', cat:'soft',  pv:3.00, pv50:null, consigne:0, seuil:5,  color:'#d4a800', icon:'🍋' },
  { ref:'P03',      nom:'Eau',               cat:'eau',   pv:1.00, pv50:null, consigne:0, seuil:5,  color:'#1f7fd1', icon:'💧' },
  { ref:'F01',      nom:'Hot-dog',           cat:'food',  pv:6.00, pv50:null, consigne:0, seuil:5,  color:'#c2410c', icon:'🌭', suivi:false },
  { ref:'F02',      nom:'Frites',            cat:'food',  pv:3.50, pv50:null, consigne:0, seuil:10, color:'#e0a800', icon:'🍟', suivi:false },
  { ref:'F03',      nom:'Panini',            cat:'food',  pv:6.00, pv50:null, consigne:0, seuil:5,  color:'#9a5b2b', icon:'🥪', suivi:false },
  { ref:'F04',      nom:'Panini VG',         cat:'food',  pv:6.00, pv50:null, consigne:0, seuil:3,  color:'#2f8f3a', icon:'🥗', suivi:false },
  { ref:'F05',      nom:'Tenders',           cat:'food',  pv:6.00, pv50:null, consigne:0, seuil:5,  color:'#b7791f', icon:'🍗', suivi:false },
  { ref:'F06',      nom:'Sucré',             cat:'sucre', pv:1.50, pv50:null, consigne:0, seuil:5,  color:'#c026a3', icon:'🍬', suivi:false },
  { ref:'E01',      nom:'Écocup 33cl',       cat:'eco',   pv:0,    pv50:null, consigne:1.00, seuil:0 },
  { ref:'E02',      nom:'Écocup 50cl',       cat:'eco',   pv:0,    pv50:null, consigne:1.00, seuil:0 },
];

const PARAMS = { rdt33: 90, rdt50: 60, seuil33: 15, seuil50: 10 };

function sellable() { return CATALOGUE.filter(p => p.cat !== 'eco'); }
function priceOf(p) { return p.pv || p.pv50 || 0; }

// ── Init stocks par défaut ──────────────────────────────────────────
function initDefaultStocks() {
  for (let t = 1; t <= 5; t++) {
    const k = 'Tab. ' + t;
    state.stocks[k] = {};
    sellable().filter(p => p.suivi !== false).forEach(p => { state.stocks[k][p.ref] = 0; });
  }
}
initDefaultStocks();

// ── Ventes init ─────────────────────────────────────────────────────
function resetVentes() {
  state.ventes = {};
  sellable().forEach(p => { state.ventes[p.ref] = 0; });
  state.ecocups = { E01:0, E02:0 };
  state.rembs   = { E01:0, E02:0 };
}
resetVentes();

// ═══════════════════════════════════════════════════════════════════
// THEME (clair par défaut)
// ═══════════════════════════════════════════════════════════════════
let currentTheme = 'light';
const ICON_MOON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
const ICON_SUN  = '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
function applyTheme() {
  document.documentElement.setAttribute('data-theme', currentTheme);
  // Icône = thème vers lequel on bascule
  document.querySelector('[data-theme-toggle] svg').innerHTML = currentTheme === 'light' ? ICON_MOON : ICON_SUN;
}
function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('buvette_theme', currentTheme); } catch(e) {}
  applyTheme();
}
try { const t = localStorage.getItem('buvette_theme'); if (t === 'dark' || t === 'light') currentTheme = t; } catch(e) {}
applyTheme();

// ═══════════════════════════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════════════════════════
function renderTabs() {
  const c = document.getElementById('tab-selector');
  c.innerHTML = '';
  const tabs = Object.keys(state.stocks).filter(k => Object.values(state.stocks[k]).some(v => v > 0));
  (tabs.length ? tabs : ['Tab. 1','Tab. 2','Tab. 3']).forEach(t => addTabBtn(c, t));
}
function addTabBtn(c, t) {
  const b = document.createElement('button');
  b.className = 'tab-btn' + (t === state.tab ? ' active' : '');
  b.textContent = t;
  b.onclick = () => { state.tab = t; document.getElementById('tab-badge').textContent = t; renderAll(); };
  c.appendChild(b);
}

// ═══════════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════════
function renderAll() {
  renderTabs();
  renderAlerts();
  renderStockList();
  renderProducts();
  renderCA();
}

function isTracked(ref) {
  const s = state.stocks[state.tab] || {};
  const p = CATALOGUE.find(c => c.ref === ref);
  return (ref in s) || !p || p.suivi !== false;
}
function stockInit(ref) { return (state.stocks[state.tab] || {})[ref] || 0; }
function stockDispo(ref) {
  if (!isTracked(ref)) return Infinity;                 // food non suivie en stock : jamais bloquée
  return Math.max(0, stockInit(ref) - (state.ventes[ref] || 0));
}
function seuilOf(p) {
  if (p.ref === 'P01_33') return PARAMS.seuil33;
  if (p.ref === 'P01_50') return PARAMS.seuil50;
  return p.seuil || 0;
}
function stockClass(p) {
  const d = stockDispo(p.ref);
  if (d === 0) return 'crit';
  if (d <= seuilOf(p)) return 'warn';
  return 'ok';
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderProducts() {
  const zone = document.getElementById('products-zone');
  const groups = {};
  sellable().forEach(p => { const c = GROUP_OF[p.cat] || 'autre'; (groups[c] = groups[c] || []).push(p); });
  const order = Object.keys(groups).sort((a,b) => CATS[a].order - CATS[b].order);
  let html = '';
  order.forEach(cat => {
    html += `<section><div class="section-title">${CATS[cat].label}</div><div class="product-grid">`;
    groups[cat].forEach(p => {
      const dispo = stockDispo(p.ref);
      const vendu = state.ventes[p.ref] || 0;
      const cls   = stockClass(p);
      const lowCls = cls === 'crit' ? 'empty' : (cls === 'warn' ? 'low' : '');
      const unite = p.unite ? ' ' + p.unite : '';
      html += `
        <div class="product-card${vendu > 0 ? ' has-sale' : ''}${dispo <= 0 && vendu === 0 ? ' is-empty' : ''}" style="--accent:${esc(p.color || '#1a2e4a')}">
          <div class="card-band"></div>
          <div class="card-body">
            <div class="product-head">
              <div class="product-icon" aria-hidden="true">${p.icon || '🛒'}</div>
              <div>
                <div class="product-name">${esc(p.nom)}</div>
                <div class="product-price">${fmt(priceOf(p))}</div>
              </div>
            </div>
            <div class="qty-control">
              <button class="qty-btn minus" onclick="changeQty('${p.ref}',-1)" ${vendu <= 0 ? 'disabled' : ''} aria-label="Retirer ${esc(p.nom)}">−</button>
              <div class="qty-display">${vendu}</div>
              <button class="qty-btn plus" onclick="changeQty('${p.ref}',1)" ${dispo <= 0 ? 'disabled' : ''} aria-label="Ajouter ${esc(p.nom)}">+</button>
            </div>
            ${dispo === Infinity ? '' : `<div class="stock-remaining ${lowCls}">${dispo <= 0 ? 'Épuisé' : 'Dispo : ' + dispo + unite}</div>`}
          </div>
        </div>`;
    });
    html += '</div></section>';
  });
  zone.innerHTML = html;
}

function renderStockList() {
  const l = document.getElementById('stock-list');
  l.innerHTML = sellable().filter(p => isTracked(p.ref)).map(p =>
    `<div class="stock-item"><span class="stock-label">${esc(p.nom)}</span><span class="stock-qty ${stockClass(p)}">${stockDispo(p.ref)}</span></div>`
  ).join('');
}

function renderAlerts() {
  const z = document.getElementById('alerts-zone');
  z.innerHTML = '';
  sellable().forEach(p => {
    if (stockInit(p.ref) <= 0) return;           // produit non approvisionné sur cette tablette
    const d = stockDispo(p.ref);
    const isBiere = p.cat === 'biere';
    if (d === 0) addAlert(z, 'err', isBiere ? `🚨 ${p.nom} ÉPUISÉE — changer le fût !` : `🚨 ${p.nom} épuisé`);
    else if (d <= seuilOf(p)) addAlert(z, 'warn', isBiere ? `⚠️ ${p.nom} : ${d} verres restants — prévoir le fût` : `⚠️ ${p.nom} : plus que ${d}`);
  });
}
function addAlert(z, type, msg) {
  const d = document.createElement('div');
  d.className = 'alert-banner ' + (type === 'warn' ? 'warn' : 'err');
  d.textContent = msg;
  z.appendChild(d);
}

function renderEcocups() {
  ['E01','E02'].forEach(ref => {
    document.getElementById('qty-' + ref).textContent  = state.ecocups[ref] || 0;
    document.getElementById('remb-' + ref).textContent = state.rembs[ref] || 0;
  });
  const net = ((state.ecocups.E01||0) - (state.rembs.E01||0)) + ((state.ecocups.E02||0) - (state.rembs.E02||0));
  document.getElementById('net-consigne').textContent = fmt(net);
}

function renderCA() {
  document.getElementById('ca-total-display').textContent = fmt(calcCA());
}

function calcCA() {
  let ca = 0;
  sellable().forEach(p => { ca += (state.ventes[p.ref] || 0) * priceOf(p); });
  ca += (state.ecocups.E01||0) - (state.rembs.E01||0);
  ca += (state.ecocups.E02||0) - (state.rembs.E02||0);
  return ca;
}

// ═══════════════════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════════════════
function changeQty(ref, delta) {
  const current = state.ventes[ref] || 0;
  if (delta > 0 && stockDispo(ref) <= 0) return;
  if (delta < 0 && current <= 0) return;
  state.ventes[ref] = current + delta;
  renderAll();
}
function changeEcocup(ref, delta) {
  const cur = state.ecocups[ref] || 0;
  if (delta < 0 && cur <= 0) return;
  state.ecocups[ref] = cur + delta;
  renderEcocups(); renderCA();
}
function changeRemb(ref, delta) {
  const cur   = state.rembs[ref] || 0;
  const vendu = state.ecocups[ref] || 0;
  if (delta < 0 && cur <= 0) return;
  if (delta > 0 && cur >= vendu) return;
  state.rembs[ref] = cur + delta;
  renderEcocups(); renderCA();
}

// ═══════════════════════════════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════════════════════════════
function openSettings() {
  document.getElementById('sel-tab').value   = state.tab;
  document.getElementById('inp-match').value = state.matchId;
  document.getElementById('inp-date').value  = state.date;
  document.getElementById('inp-url').value   = state.url;
  document.getElementById('modal-settings').classList.add('open');
}
function saveSettings() {
  state.tab     = document.getElementById('sel-tab').value;
  state.matchId = document.getElementById('inp-match').value.trim();
  state.date    = document.getElementById('inp-date').value;
  state.url     = document.getElementById('inp-url').value.trim();
  document.getElementById('tab-badge').textContent = state.tab;
  document.getElementById('match-label').textContent = state.matchId || 'Aucun match configuré';
  closeModal('modal-settings');
  renderAll();
}

// ── Synchro pré-match GET ───────────────────────────────────────────
async function syncPreMatch() {
  const url = state.url || document.getElementById('inp-url').value.trim();
  const statusEl = document.getElementById('sync-status-pre');
  if (!url) { statusEl.className = 'sync-status err'; statusEl.textContent = '❌ URL non configurée.'; return; }
  state.url = url;
  statusEl.className = 'sync-status'; statusEl.textContent = '⏳ Connexion…'; statusEl.style.display = 'block';
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const cfg = await r.json();
    if (applyTabletConfig(cfg) === false) return;
    statusEl.className = 'sync-status ok';
    statusEl.textContent = '✅ Config reçue — Match ' + (cfg.matchId || '?');
  } catch(e) {
    statusEl.className = 'sync-status err';
    statusEl.textContent = '❌ Erreur : ' + e.message;
  }
}

// ── GARDE-FOU ÉTANCHÉITÉ BUVETTE / BOUTIQUE ──────────────────
const APP_ID = 'BUVETTE';
function alertWrongCatalog(t){
  const msg = '⛔ Mauvais catalogue : ce lien renvoie la ' + String(t).toUpperCase() +
    '.\nCette tablette est la BUVETTE.\nCorrige l\'URL Apps Script dans Configuration.';
  const el = document.getElementById('sync-status-pre');
  if (el){ el.className='sync-status err'; el.style.display='block';
    el.textContent='⛔ Catalogue « '+t+' » refusé — cette tablette est la BUVETTE.'; }
  try { alert(msg); } catch(e){}
}
function guardCatalogSource(cfg){
  if (!cfg || typeof cfg !== 'object') return true;
  if (cfg.app && String(cfg.app).toLowerCase() !== 'buvette'){ alertWrongCatalog(cfg.app); return false; }
  const looksBoutique =
    ('stock_B1' in cfg) || ('stock_B2' in cfg) ||
    (Array.isArray(cfg.produits) && cfg.produits.some(function(p){
      return p && (('prix_vente' in p) || ('stock_B1' in p) || p.categorie === 'Maillots');
    }));
  if (looksBoutique){ alertWrongCatalog('boutique'); return false; }
  return true;
}

// Normalise une catégorie venant du Sheet vers une clé de CATS
function mapCat(raw) {
  const c = String(raw || '').toLowerCase();
  if (c.includes('bi')) return 'biere';
  if (c.includes('sucr') || c.includes('crêpe') || c.includes('crepe') || c.includes('bonbon')) return 'sucre';
  if (c.includes('food') || c.includes('salé') || c.includes('sale') || c.includes('chaud') || c.includes('repas')) return 'food';
  if (c.includes('eau')) return 'eau';
  if (c.includes('eco') || c.includes('éco') || c.includes('consigne')) return 'eco';
  if (c.includes('snack') || c.includes('sucr') || c.includes('sal') || c.includes('confis') || c.includes('chips')) return 'snack';
  if (c.includes('soft') || c.includes('soda') || c.includes('boisson')) return 'soft';
  return 'autre';
}

function applyTabletConfig(cfg) {
  if (!guardCatalogSource(cfg)) return false;

  if (cfg.matchId) { state.matchId = cfg.matchId; document.getElementById('inp-match').value = cfg.matchId; document.getElementById('match-label').textContent = cfg.matchId; }
  if (cfg.params_fut) {
    PARAMS.rdt33   = cfg.params_fut.rdt33   || 90;
    PARAMS.rdt50   = cfg.params_fut.rdt50   || 60;
    PARAMS.seuil33 = cfg.params_fut.seuil_alerte_33cl || 15;
    PARAMS.seuil50 = cfg.params_fut.seuil_alerte_50cl || 10;
  }
  // Produits : mise à jour des prix + ajout automatique des produits du Sheet absents du catalogue local
  if (Array.isArray(cfg.produits)) {
    cfg.produits.forEach(p => {
      if (!p || !p.ref) return;
      let local = CATALOGUE.find(c => c.ref === p.ref);
      if (!local) {
        const cat = mapCat(p.categorie || p.cat);
        local = { ref:p.ref, nom:p.nom || p.produit || p.ref, cat, pv:0, pv50:null, consigne:0, seuil:5, color:p.couleur || '#1a2e4a', icon:p.icone || '' };
        CATALOGUE.push(local);
      }
      if (p.nom || p.produit) local.nom = p.nom || p.produit;
      if (p.pv_33cl) local.pv  = Number(p.pv_33cl);
      if (p.pv_50cl) local.pv50 = Number(p.pv_50cl);
      if (p.pv)      local.pv  = Number(p.pv);
      if (p.prix)    local.pv  = Number(p.prix);
      if (p.consigne !== undefined) local.consigne = p.consigne;
      if (p.seuil !== undefined && p.seuil !== '') local.seuil = Number(p.seuil);
      if (p.actif === false || p.actif === 'NON') local.cat = 'eco_off'; // masqué
    });
  }
  if (cfg.stocks_tablettes) {
    Object.entries(cfg.stocks_tablettes).forEach(([tab, items]) => {
      if (!state.stocks[tab]) state.stocks[tab] = {};
      items.forEach(item => {
        if (item.type === 'biere_33') state.stocks[tab].P01_33 = item.qty_verres;
        else if (item.type === 'biere_50') state.stocks[tab].P01_50 = item.qty_verres;
        else {
          state.stocks[tab][item.ref] = item.qty_unites;
          // Produit présent en stock mais inconnu du catalogue → on l'affiche quand même
          if (item.ref && !CATALOGUE.find(c => c.ref === item.ref)) {
            CATALOGUE.push({ ref:item.ref, nom:item.nom || item.produit || item.ref, cat:mapCat(item.categorie), pv:Number(item.pv || item.prix || 0), pv50:null, consigne:0, seuil:5, color:'#1a2e4a', icon:'' });
          }
        }
      });
    });
  }
  // Les produits désactivés (cat 'eco_off') ne sont ni vendables ni affichés
  for (let i = CATALOGUE.length - 1; i >= 0; i--) if (CATALOGUE[i].cat === 'eco_off') CATALOGUE.splice(i, 1);
  resetVentes();
  renderAll();
  renderEcocups();
  return true;
}

// ═══════════════════════════════════════════════════════════════════
// RAPPORT
// ═══════════════════════════════════════════════════════════════════
function openRapport() {
  const c = document.getElementById('rapport-content');
  const ventes = sellable().filter(p => (state.ventes[p.ref] || 0) > 0)
    .map(p => ({ ref: p.ref, produit: p.nom, qty: state.ventes[p.ref], pv: priceOf(p), consigne: 0 }));
  if ((state.ecocups.E01||0) > 0) ventes.push({ ref:'E01', produit:'Écocup 33cl', qty: state.ecocups.E01, pv: 0, consigne: 1.00 });
  if ((state.ecocups.E02||0) > 0) ventes.push({ ref:'E02', produit:'Écocup 50cl', qty: state.ecocups.E02, pv: 0, consigne: 1.00 });

  const rembs = [];
  if ((state.rembs.E01||0) > 0) rembs.push({ ref:'E01', qty: state.rembs.E01, montant: state.rembs.E01 });
  if ((state.rembs.E02||0) > 0) rembs.push({ ref:'E02', qty: state.rembs.E02, montant: state.rembs.E02 });

  const json = {
    matchId:   state.matchId || 'NON_CONFIGURE',
    tablette:  state.tab,
    dateMatch: state.date,
    ventes,
    remboursements_consigne: rembs
  };

  let html = '<div class="rapport-section"><div class="rapport-section-title">Ventes</div>';
  if (!ventes.length) html += '<div class="rapport-row"><span>Aucune vente enregistrée</span><b>—</b></div>';
  ventes.forEach(v => {
    const total = v.qty * v.pv + v.qty * v.consigne;
    html += `<div class="rapport-row"><span>${esc(v.produit)} × ${v.qty}</span><b>${fmt(total)}</b></div>`;
  });
  html += '</div>';

  if (rembs.length > 0) {
    html += '<div class="rapport-section"><div class="rapport-section-title">Remboursements consigne</div>';
    rembs.forEach(r => {
      html += `<div class="rapport-row"><span>Remb. écocup ${r.ref === 'E01' ? '33cl' : '50cl'} × ${r.qty}</span><b style="color:var(--error)">−${fmt(r.montant)}</b></div>`;
    });
    html += '</div>';
  }

  html += `<div class="rapport-total"><span class="rapport-total-label">💰 CA Total</span><span class="rapport-total-value">${fmt(calcCA())}</span></div>`;
  html += '<div class="rapport-section-title">JSON à envoyer au Sheet</div>';
  html += `<div class="json-block" id="json-block">${esc(JSON.stringify(json, null, 2))}</div>`;
  html += `<button class="btn-copy" onclick="copyJson()">📋 Copier le JSON</button>`;
  html += `<button class="btn-primary" style="margin-top:var(--space-2)" onclick="sendReport()">📤 Envoyer au Sheet</button>`;
  html += `<div class="sync-status" id="sync-status-post"></div>`;

  c.innerHTML = html;
  document.getElementById('modal-rapport').classList.add('open');
  c._json = json;
}

function copyJson() {
  const txt = document.getElementById('json-block').textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = '✅ Copié !';
    setTimeout(() => btn.textContent = '📋 Copier le JSON', 2000);
  });
}

async function sendReport() {
  const url      = state.url;
  const statusEl = document.getElementById('sync-status-post');
  const content  = document.getElementById('rapport-content')._json;
  if (!url) { statusEl.className = 'sync-status err'; statusEl.textContent = '❌ URL non configurée dans les paramètres.'; return; }
  statusEl.className = 'sync-status'; statusEl.textContent = '⏳ Envoi en cours…'; statusEl.style.display = 'block';
  try {
    const r = await fetch(url, { method:'POST', body: JSON.stringify(content), headers:{'Content-Type':'application/json'} });
    const res = await r.json();
    if (res.status === 'ok') {
      statusEl.className = 'sync-status ok';
      statusEl.textContent = '✅ Rapport envoyé et enregistré dans le Sheet !';
    } else {
      throw new Error(res.message || 'Erreur serveur');
    }
  } catch(e) {
    statusEl.className = 'sync-status err';
    statusEl.textContent = '❌ Erreur : ' + e.message + ' — Utilisez le JSON manuel.';
  }
}

// ═══════════════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════════════
function fmt(n) {
  return Number(n).toLocaleString('fr-FR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' €';
}
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); });
});

document.getElementById('inp-date').value = state.date;

// Verrouillage paysage quand le navigateur l'autorise (PWA installée / plein écran)
try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch(e) {}

// ── Init ─────────────────────────────────────────────────────────────
renderAll();
renderEcocups();
</script>
</body>
</html>
